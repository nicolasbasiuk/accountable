[project]
name = "accountable"
version = "0.1.0"
description = "A sales CRM for a small business"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.165.0",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
filterwarnings = [
    "error",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
