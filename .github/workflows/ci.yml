name: CI

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # All of the history, so gitleaks also finds a secret that a later commit removed.
          persist-credentials: false

      - name: Install gitleaks
        env:
          VERSION: 8.30.1
        run: |
          cd "$RUNNER_TEMP"
          release="https://github.com/gitleaks/gitleaks/releases/download/v$VERSION"
          archive="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$release/$archive"
          curl -fsSLO "$release/gitleaks_${VERSION}_checksums.txt"
          grep " $archive\$" "gitleaks_${VERSION}_checksums.txt" | sha256sum --check
          mkdir -p gitleaks-bin
          tar -xzf "$archive" -C gitleaks-bin gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Look for secrets in every commit
        run: gitleaks git --no-banner --redact --verbose

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - uses: astral-sh/setup-uv@v10.4.0 # With no version given, it installs the latest uv.

      - run: npm run check:quick
