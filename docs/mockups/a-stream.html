<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup A, Stream</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500;600&display=block">
<style>
:root { --page:#F0F4F5; --ink:#073B4C; --muted:#4F6C78; --green:#06D6A0; --green-dark:#047A5B; --blue:#118AB2; --alert:#EF476F; --hair:#DEE7EA; --wash:#E4EBED; }
* { box-sizing:border-box; }
body { margin:0; background:var(--page); color:var(--ink); font:400 15px/1.45 'Instrument Sans',sans-serif; display:grid; grid-template-columns:208px minmax(0,1fr); min-width:1280px; }
.mono { font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums; font-variant-ligatures:none; }
a { color:inherit; text-decoration:underline; text-decoration-color:rgb(7 59 76 / .3); text-underline-offset:3px; }
a:hover { text-decoration-color:currentColor; }
:focus-visible { outline:3px solid var(--blue); outline-offset:2px; border-radius:6px; }
[data-page=dashboard] #pipeline-page, [data-page=pipeline] #dashboard-page { display:none; }

/* Frame */
aside { position:sticky; top:0; height:100vh; padding:30px 14px; }
.brand { display:flex; align-items:center; gap:10px; padding:0 12px 28px; font-weight:700; font-size:18px; letter-spacing:-.02em; }
.nav { display:flex; align-items:center; gap:12px; padding:10px 12px; margin-bottom:2px; border-radius:12px; color:var(--muted); font-weight:500; text-decoration:none; }
.nav[aria-current] { background:#fff; color:var(--ink); font-weight:600; }
main { padding:26px 32px 48px 18px; max-width:1640px; }
header { display:flex; align-items:flex-start; justify-content:space-between; gap:24px; margin-bottom:18px; }
h1 { margin:0; font-size:28px; line-height:1.2; font-weight:600; letter-spacing:-.02em; }
.line { margin:2px 0 0; font:400 21px/1.3 'Instrument Serif',serif; }
button { font:600 15px/1 'Instrument Sans',sans-serif; color:var(--ink); border:0; cursor:pointer; }
.main-button { display:inline-flex; align-items:center; gap:8px; background:var(--green); border-radius:12px; padding:12px 18px 12px 14px; }
.panel { background:#fff; border-radius:20px; padding:20px 24px; }
h2 { margin:0; font-size:16px; line-height:1.3; font-weight:600; }
.head { display:flex; justify-content:space-between; align-items:baseline; gap:16px; }
.head a { font-size:14px; color:var(--muted); }
.tag { display:inline-block; background:var(--alert); color:#fff; font-weight:600; font-size:14px; line-height:1; padding:5px 9px 6px; border-radius:8px; white-space:nowrap; }
svg text { font-family:'JetBrains Mono',monospace; font-size:12px; fill:var(--ink); font-variant-ligatures:none; }

/* Dashboard */
.figures { display:grid; grid-template-columns:repeat(4,1fr); padding:20px 28px; margin-bottom:16px; }
.figures dt { color:var(--muted); font-size:14.5px; }
.figures dd { margin:2px 0 0; font-size:30px; line-height:1.2; font-weight:500; letter-spacing:-.04em; }
.figures p { margin:2px 0 0; font-size:14px; color:var(--muted); }
.charts { display:grid; grid-template-columns:minmax(0,3fr) minmax(0,2fr); gap:16px; margin-bottom:16px; }
.chart { height:206px; margin-top:12px; }
.stream { height:178px; margin:16px 0 14px; }
.stages { display:grid; grid-template-columns:repeat(5,1fr); }
.stage-name { display:flex; align-items:center; gap:8px; font-weight:600; }
.dot { width:11px; height:11px; border-radius:50%; flex:none; }
.stage-open { padding-right:22px; }
.meter { height:10px; border-radius:5px; margin:2px 0 8px; position:relative; overflow:hidden; }
.meter i { position:absolute; inset:0 auto 0 0; border-radius:5px; }
.pair { display:flex; justify-content:space-between; font-size:14px; gap:8px; }
.pair span:first-child { color:var(--muted); }
.key { font-size:14px; color:var(--muted); line-height:1.5; }
.lists { display:grid; grid-template-columns:minmax(0,21fr) minmax(0,10fr); gap:16px; margin-top:16px; align-items:start; }
h3 { margin:16px 0 0; font-size:15px; font-weight:600; display:flex; gap:8px; align-items:baseline; }
h3 .mono { font-weight:500; color:var(--muted); }
ul { list-style:none; margin:4px 0 0; padding:0; }
.task { display:grid; grid-template-columns:20px minmax(0,1.12fr) minmax(0,1fr) 100px; gap:12px; align-items:center; min-height:40px; padding:4px 0; line-height:1.35; }
.task > :last-child { justify-self:end; }
.task input { width:18px; height:18px; margin:0; accent-color:var(--green-dark); }
.task small, .event small { display:block; font-size:14px; color:var(--muted); }
.task, .event { font-size:14.5px; }
.task time, .event time { font-size:13px; }
.event { display:grid; grid-template-columns:34px minmax(0,1fr); gap:12px; align-items:center; padding:6px 0; line-height:1.4; }
.event b { width:34px; height:34px; border-radius:11px; background:var(--page); display:grid; place-items:center; }

/* Pipeline */
#pipeline-page { height:100vh; display:flex; flex-direction:column; padding-bottom:0; max-width:none; }
.board-figures { display:flex; gap:32px; align-items:baseline; margin:6px 0 0; font-size:15px; color:var(--muted); }
.board-figures .mono { color:var(--ink); font-weight:600; font-size:17px; letter-spacing:-.02em; margin-right:6px; }
.board-stream { height:44px; flex:none; margin-bottom:10px; }
.board { flex:1; min-height:0; display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:10px; }
.column { display:flex; flex-direction:column; min-height:0; }
.column-head { padding:0 4px 10px; min-height:104px; }
.column-title { display:flex; align-items:center; gap:8px; font-weight:600; }
.column-title .mono { color:var(--muted); font-weight:500; font-size:14px; }
.column-title button { margin-left:auto; background:none; padding:4px; border-radius:8px; display:grid; }
.column-title button:hover { background:var(--wash); }
.column-head .value { font-size:17px; font-weight:600; letter-spacing:-.03em; margin-top:2px; }
.column-head .expected { font-size:13.5px; color:var(--muted); }
.column-head .expected .mono { font-size:13px; }
.cards { flex:1; min-height:0; overflow-y:auto; padding-bottom:24px; scrollbar-width:none; display:flex; flex-direction:column; gap:8px; }
.card { background:#fff; border-radius:14px; padding:12px 13px; cursor:grab; flex:none; }
.card a { font-weight:600; line-height:1.3; }
.card .org { font-size:13.5px; line-height:1.35; color:var(--muted); margin:1px 0 8px; }
.card .row { display:flex; justify-content:space-between; gap:6px; font-size:13.5px; font-weight:500; }
.card .close { font-size:12.5px; color:var(--muted); margin-top:1px; }
.card .tag { margin-top:8px; }
@media (max-width:1400px) { main { padding-right:20px; padding-left:8px; } .card { padding:11px; } }
</style>
</head>
<body data-page="dashboard">
<aside><div class="brand" id="brand"></div><nav id="nav" aria-label="Sections"></nav></aside>

<main id="dashboard-page">
  <header><div><h1>Dashboard</h1><p class="line" id="line"></p></div><button class="main-button" id="add1"></button></header>
  <dl class="panel figures" id="figures"></dl>
  <div class="charts">
    <section class="panel"><div class="head"><h2>Revenue won by month</h2><a href="#dashboard">Show table</a></div><div class="chart" id="line-chart" data-label="Line chart of revenue won in each of the last 12 months"></div></section>
    <section class="panel"><div class="head"><h2>Deals won by month</h2><a href="#dashboard">Show table</a></div><div class="chart" id="bar-chart" data-label="Bar chart of deals won in each of the last 12 months"></div></section>
  </div>
  <section class="panel">
    <div class="head"><h2>How far deals get</h2><a href="#dashboard">Show table</a></div>
    <div class="stream" id="stream" data-label="Funnel of the value that reached each stage"></div>
    <div class="stages" id="stages"></div>
  </section>
  <div class="lists">
    <section class="panel"><h2>Follow-ups</h2><div id="tasks"></div></section>
    <section class="panel"><h2>Recent activity</h2><div id="events"></div></section>
  </div>
</main>

<main id="pipeline-page">
  <header><div><h1>Pipeline</h1><p class="board-figures" id="board-figures"></p></div><button class="main-button" id="add2"></button></header>
  <div class="board-stream" id="board-stream" data-label="Value in each column"></div>
  <div class="board" id="board"></div>
</main>

<script src="data.js"></script>
<script>
const M = t => `<span class="mono">${t}</span>`;
fill('#brand', MARK + 'Accountable'); fill('#nav', navHTML()); fill('#line', LINE);
fill('#add1', icon('plus') + 'Add deal'); fill('#add2', icon('plus') + 'Add deal');
fill('#figures', [
  ['Revenue won this month', usd(FIGURES.wonMonth), `${M(FIGURES.wonMonthDeals)} deals`],
  ['Revenue won in 12 months', usd(FIGURES.won12), `${M(FIGURES.won12Deals)} deals`],
  ['Open value', usd(FIGURES.open), `${M(FIGURES.openDeals)} deals`],
  ['Expected revenue', usd(FIGURES.expected), `${M(Math.round(FIGURES.expected / FIGURES.open * 100) + '%')} of open value`],
].map(([a, b, c]) => `<div><dt>${a}</dt><dd class="mono">${b}</dd><p>${c}</p></div>`).join(''));

const frame = (w, h, left) => ({ l: left, r: w - 8, t: 14, b: h - 24 });
draw('#line-chart', (w, h) => {
  const f = frame(w, h, 52), max = 250000, right = f.r - 78;
  const x = i => f.l + 12 + i * (right - f.l - 12) / 11, y = v => f.b - v / max * (f.b - f.t);
  const pts = MONTHS.map((m, i) => [x(i), y(m[1])]), d = smooth(pts);
  const label = (i, dy) => `<text x="${x(i)}" y="${y(MONTHS[i][1]) + dy}" text-anchor="middle" font-weight="600">${usd(MONTHS[i][1])}</text>`;
  return [0, 50000, 100000, 150000, 200000, 250000].filter(v => v % 100000 === 0 || v === 0).map(v => `<line x1="${f.l}" x2="${f.r}" y1="${y(v)}" y2="${y(v)}" stroke="#DEE7EA"/><text x="${f.l - 10}" y="${y(v) + 4}" text-anchor="end">${usdK(v)}</text>`).join('')
    + `<path d="${d}L${x(11)},${f.b}L${x(0)},${f.b}Z" fill="#06D6A0" fill-opacity=".16"/><path d="${d}" fill="none" stroke="#047A5B" stroke-width="2.5" stroke-linecap="round"/>`
    + [10, 11].map(i => `<circle cx="${x(i)}" cy="${y(MONTHS[i][1])}" r="5" fill="#047A5B" stroke="#fff" stroke-width="2"/>`).join('') + label(10, -13) + `<text x="${x(11) + 12}" y="${y(MONTHS[11][1]) + 4}" font-weight="600">${usd(MONTHS[11][1])}</text>`
    + MONTHS.map((m, i) => `<text x="${x(i)}" y="${h - 4}" text-anchor="middle">${m[0]}</text>`).join('');
});
draw('#bar-chart', (w, h) => {
  const f = frame(w, h, 4), step = (f.r - f.l) / 12, bw = Math.min(22, step - 10), y = v => f.b - v / 5 * (f.b - f.t);
  return `<line x1="${f.l}" x2="${f.r}" y1="${f.b}" y2="${f.b}" stroke="#DEE7EA"/>` + MONTHS.map((m, i) => {
    const cx = f.l + step * (i + .5), t = y(m[2]);
    return `<path d="M${cx - bw / 2},${f.b}V${t + 4}q0,-4 4,-4h${bw - 8}q4,0 4,4V${f.b}Z" fill="#06D6A0"/><text x="${cx}" y="${t - 7}" text-anchor="middle" font-weight="600">${m[2]}</text><text x="${cx}" y="${h - 4}" text-anchor="middle">${m[0]}</text>`;
  }).join('');
});
// One ribbon, cut into stages. Its thickness is the value.
function ribbon(id, values, w, h, gap, flat, cw = w / values.length) {
  const n = values.length, max = Math.max(...values), half = v => v / max * h / 2;
  const edge = [];
  values.forEach((v, i) => { const x0 = i * cw, a = i ? x0 + cw * flat : 0, b = i < n - 1 ? x0 + cw * (1 - flat) : w; edge.push([a, half(v)], [b, half(v)]); });
  const R = Math.min(12, edge.at(-1)[1]), at = (i, k) => h / 2 + k * edge[i][1], z = edge.length - 1;
  const curve = (from, to, k) => `C${(edge[from][0] + edge[to][0]) / 2},${at(from, k)} ${(edge[from][0] + edge[to][0]) / 2},${at(to, k)} ${edge[to][0]},${at(to, k)}`;
  let d = `M0,${at(0, -1) + R}Q0,${at(0, -1)} ${R},${at(0, -1)}`;
  for (let i = 1; i < z; i++) d += i % 2 ? `L${edge[i][0]},${at(i, -1)}` : curve(i - 1, i, -1);
  d += `L${w - R},${at(z, -1)}Q${w},${at(z, -1)} ${w},${at(z, -1) + R}L${w},${at(z, 1) - R}Q${w},${at(z, 1)} ${w - R},${at(z, 1)}`;
  for (let i = z - 1; i > 0; i--) d += i % 2 ? curve(i + 1, i, 1) : `L${edge[i][0]},${at(i, 1)}`;
  d += `L${R},${at(0, 1)}Q0,${at(0, 1)} 0,${at(0, 1) - R}Z`;
  return { cw, clip: `<clipPath id="${id}"><path d="${d}"/></clipPath>`, rect: (i, color) => `<rect x="${i * cw}" width="${i < n - 1 ? cw - gap : w - i * cw}" y="0" height="${h}" fill="${color}" clip-path="url(#${id})"/>` };
}
draw('#stream', (w, h) => {
  const r = ribbon('flow', FUNNEL.map(f => f.value), w, h, 3, .2);
  return r.clip + FUNNEL.map((f, i) => r.rect(i, f.color)).join('') + FUNNEL.map((f, i) => {
    const x = i * r.cw + (i ? r.cw * .2 : 22);
    const share = i ? `<rect x="${i * r.cw - 27}" y="${h / 2 - 15}" width="54" height="30" rx="15" fill="#fff"/><text x="${i * r.cw}" y="${h / 2 + 5}" text-anchor="middle" style="font-size:14px;font-weight:600">${f.share}%</text>` : '';
    return `<text x="${x}" y="${h / 2 - 2}" style="font-size:17px;font-weight:600;fill:${f.on};letter-spacing:-.03em">${usd(f.value)}</text><text x="${x}" y="${h / 2 + 18}" style="font-size:14px;font-weight:600;fill:${f.on}">${f.deals} deals</text>` + share;
  }).join('');
});
const widest = Math.max(...OPEN.map(c => c.value));
fill('#stages', FUNNEL.map((f, i) => {
  const c = OPEN[i], name = `<div class="stage-name"><i class="dot" style="background:${f.color}"></i>${f.name}</div>`;
  if (!c) return `<div>${name}<p class="key" style="margin:4px 0 0">The same ${M(FIGURES.won12Deals)} deals as in the charts above. Bars show open value, with expected revenue in the darker part.</p></div>`;
  return `<div class="stage-open">${name}<div class="meter" style="width:${c.value / widest * 100}%;background:color-mix(in srgb,${c.color} 32%,#fff);margin-top:8px"><i style="width:${c.expected / c.value * 100}%;background:${c.color}"></i></div><div class="pair"><span>Open now</span>${M(usd(c.value))}</div><div class="pair"><span>Expected</span>${M(usd(c.expected))}</div></div>`;
}).join(''));
const who = (rec, org) => `<a href="#dashboard">${esc(rec)}</a>, ${esc(org)}`;
const group = (title, list) => `<div><h3>${title} ${M(list.length)}</h3><ul>${list.map(([d, t, text, rec, org]) => `<li class="task"><input type="checkbox" aria-label="Mark done: ${text}"><span>${text}</span><small>${who(rec, org)}</small>${daysFromToday(d) < 0 ? `<span class="tag">${M(-daysFromToday(d))} ${daysFromToday(d) === -1 ? 'day' : 'days'}</span>` : `<time class="mono">${dueLabel(d)}</time>`}</li>`).join('')}</ul></div>`;
fill('#tasks', group('Overdue', OVERDUE) + group('Due in the next 14 days', DUE));
fill('#events', [...new Set(RECENT.map(r => r[0]))].map(d => `<h3><time class="mono">${d === TODAY ? 'Today' : date(d)}</time></h3><ul>${RECENT.filter(r => r[0] === d).map(([, t, text, rec, org]) => `<li class="event"><b>${icon(t, 17)}</b><div>${text}<small>${who(rec, org)}</small></div></li>`).join('')}</ul>`).join(''));

fill('#board-figures', `<span>${M(FIGURES.openDeals)}open deals</span><span>${M(usd(FIGURES.open))}open value</span><span>${M(usd(FIGURES.expected))}expected</span>`);
draw('#board-stream', (w, h) => {
  const gap = 10, cw = (w + gap) / 6, lostH = COLUMNS[5].value / Math.max(...COLUMNS.map(c => c.value)) * h;
  const r = ribbon('flow2', COLUMNS.slice(0, 5).map(c => c.value), cw * 5 - gap, h, gap, .3, cw);
  return r.clip + COLUMNS.slice(0, 5).map((c, i) => r.rect(i, c.color)).join('') + `<rect x="${cw * 5}" y="${h / 2 - lostH / 2}" width="${cw - gap}" height="${lostH}" rx="8" fill="#6B818A"/>`;
});
fill('#board', COLUMNS.map(c => `<section class="column"><div class="column-head"><div class="column-title"><i class="dot" style="background:${c.color}"></i>${c.name} ${M(c.cards.length)}<button aria-label="Add deal in ${c.name}">${icon('plus', 17)}</button></div><div class="value mono">${usd(c.value)}</div><div class="expected">${M(usd(c.expected))} expected</div>${c.key === 'won' || c.key === 'lost' ? '<div class="expected">Last <span class="mono">90</span> days</div>' : ''}</div><div class="cards">${c.cards.map(d => `<article class="card"><a href="#pipeline">${d.name}</a><div class="org">${esc(d.org)}</div><div class="row mono"><span>${usd(d.value)}</span><span>${d.p}%</span></div><div class="close mono">${date(d.close)}</div>${d.late ? `<span class="tag">Late ${M(d.late)} ${d.late === 1 ? 'day' : 'days'}</span>` : ''}</article>`).join('')}</div></section>`).join(''));
route();
</script>
</body>
</html>
