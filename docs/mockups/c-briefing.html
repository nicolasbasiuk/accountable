<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup C, Briefing</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500;600&display=block">
<style>
:root { --page:#F0F4F5; --ink:#073B4C; --muted:#4F6C78; --green:#06D6A0; --blue:#118AB2; --alert:#EF476F; --track:#E1E9EB; }
* { box-sizing:border-box; }
body { margin:0; background:var(--page); color:var(--ink); font:400 14.5px/1.45 'Instrument Sans',sans-serif; display:grid; grid-template-columns:208px minmax(0,1fr); min-width:1280px; }
.mono { font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums; font-variant-ligatures:none; }
a { color:inherit; text-decoration:underline; text-decoration-color:rgb(7 59 76 / .3); text-underline-offset:3px; }
a:hover { text-decoration-color:currentColor; }
:focus-visible { outline:3px solid var(--blue); outline-offset:2px; border-radius:6px; }
[data-page=dashboard] #pipeline-page, [data-page=pipeline] #dashboard-page { display:none; }

/* Frame */
aside { position:sticky; top:0; height:100vh; padding:12px 0 12px 12px; }
.side { height:100%; background:#fff; border-radius:18px; padding:22px 10px; }
.brand { display:flex; align-items:center; gap:10px; padding:0 10px 24px; font-weight:700; font-size:17px; letter-spacing:-.02em; }
.nav { display:flex; align-items:center; gap:11px; padding:9px 10px; margin-bottom:2px; border-radius:10px; color:var(--muted); font-weight:500; text-decoration:none; }
.nav[aria-current] { color:var(--ink); background:var(--page); font-weight:600; }
main { padding:24px 32px 48px 28px; max-width:1600px; }
header { display:flex; align-items:flex-start; justify-content:space-between; gap:24px; }
h1 { margin:0; font-size:20px; line-height:1.3; font-weight:600; letter-spacing:-.01em; }
.line { margin:0; font:400 50px/1.12 'Instrument Serif',serif; letter-spacing:-.015em; }
button { font:600 14.5px/1 'Instrument Sans',sans-serif; color:var(--ink); border:0; cursor:pointer; }
.main-button { display:inline-flex; align-items:center; gap:7px; background:var(--green); border-radius:10px; padding:11px 16px 11px 12px; white-space:nowrap; }
.panel { background:#fff; border-radius:16px; padding:18px 20px; }
h2 { margin:0; font-size:15.5px; line-height:1.3; font-weight:600; }
.head { display:flex; justify-content:space-between; align-items:baseline; gap:16px; }
.head a { font-size:14px; color:var(--muted); }
.note { margin:1px 0 0; font-size:14px; color:var(--muted); }
.tag { display:inline-block; background:var(--alert); color:#fff; font-weight:600; font-size:14px; line-height:1; padding:4px 8px 5px; border-radius:6px; white-space:nowrap; }
svg text { font-family:'JetBrains Mono',monospace; font-size:12px; fill:var(--ink); font-variant-ligatures:none; }

/* Dashboard */
.figures { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin:18px 0 20px; }
.figures dt { font-size:14.5px; color:var(--muted); }
.figures dd { margin:0; font-size:27px; line-height:1.25; font-weight:500; letter-spacing:-.05em; }
.figures p { margin:0; font-size:14px; color:var(--muted); }
.two { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-bottom:14px; align-items:stretch; }
.two.wide { grid-template-columns:minmax(0,8fr) minmax(0,5fr); }
.chart { height:194px; margin-top:8px; }
.strips { display:grid; grid-template-columns:118px minmax(0,1fr) auto auto; gap:14px 16px; align-items:center; margin-top:12px; }
.strips .col { font-size:14px; color:var(--muted); text-align:right; }
.strips .num { text-align:right; font-weight:500; }
.stage-name { display:flex; align-items:center; gap:8px; font-weight:600; line-height:1.25; }
.dot { width:10px; height:10px; border-radius:50%; flex:none; }
.stage-name small { display:block; font-weight:400; font-size:14px; color:var(--muted); }
.strip { display:flex; gap:2px; height:32px; }
.unit { position:relative; border-radius:5px; display:grid; place-items:center; font-size:14px; font-weight:600; letter-spacing:-.05em; min-width:0; }
.unit.late::after { content:''; position:absolute; top:-5px; right:-3px; width:14px; height:14px; border-radius:50%; background:var(--alert); border:2px solid #fff; }
.expect { height:5px; border-radius:3px; background:var(--ink); margin-top:5px; }
.keys { display:flex; gap:20px; margin:14px 0 0; font-size:14px; color:var(--muted); align-items:center; flex-wrap:wrap; }
.keys span { display:flex; align-items:center; gap:7px; }
.steps { height:282px; margin-top:8px; }
.columns { columns:2; column-gap:36px; margin-top:4px; }
.day { break-inside:avoid; display:grid; grid-template-columns:120px minmax(0,1fr); gap:14px; padding:8px 0; }
.day > time, .day > .tag { justify-self:start; align-self:start; margin-top:4px; font-size:13px; }
.day > .tag { font-size:14px; margin-top:2px; }
ul { list-style:none; margin:0; padding:0; }
.task { display:grid; grid-template-columns:18px minmax(0,1fr); gap:10px; padding:2px 0 8px; line-height:1.35; }
.task:last-child { padding-bottom:2px; }
.task input { width:17px; height:17px; margin:2px 0 0; accent-color:var(--ink); }
small { font-size:14px; color:var(--muted); }
.task small, .event small { display:block; }
.event { break-inside:avoid; display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:10px; padding:9px 0; line-height:1.35; }
.event .icon { margin-top:1px; color:var(--muted); }
.event time { font-size:13px; padding-top:1px; }

/* Pipeline */
#pipeline-page { height:100vh; display:flex; flex-direction:column; padding-bottom:0; max-width:none; }
.summary { margin:2px 0 16px; font-size:24px; line-height:1.25; font-weight:500; letter-spacing:-.02em; }
.summary .mono { font-weight:600; font-size:22px; letter-spacing:-.05em; }
.board { flex:1; min-height:0; display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:12px; }
.column { display:flex; flex-direction:column; min-height:0; }
.column-head { padding:0 2px 8px; }
.column-title { display:flex; align-items:center; gap:8px; font-weight:600; font-size:15.5px; }
.column-title button { margin-left:auto; background:none; padding:4px; border-radius:8px; display:grid; }
.column-title button:hover { background:var(--track); }
.column-head .strip { height:12px; margin:6px 0 8px; }
.column-head .unit { border-radius:3px; }
.facts { display:grid; grid-template-columns:auto 1fr; gap:0 10px; font-size:13.5px; line-height:1.5; color:var(--muted); min-height:82px; align-content:start; }
.facts .mono { color:var(--ink); text-align:right; font-weight:500; }
.facts .last { grid-column:1/-1; }
.cards { flex:1; min-height:0; overflow-y:auto; padding-bottom:24px; scrollbar-width:none; display:flex; flex-direction:column; gap:6px; }
.card { background:#fff; border-radius:12px; padding:10px 12px 11px; cursor:grab; flex:none; }
.card .tag { margin-bottom:6px; }
.card a { font-weight:600; line-height:1.3; }
.card .org { font-size:13.5px; line-height:1.3; color:var(--muted); }
.card .row { display:flex; justify-content:space-between; gap:6px; margin-top:7px; font-weight:500; font-size:13.5px; }
.card .meter { height:5px; border-radius:3px; background:var(--track); margin:4px 0 5px; overflow:hidden; }
.card .meter i { display:block; height:100%; border-radius:3px; }
.card .close { font-size:12.5px; color:var(--muted); line-height:1.3; }
@media (max-width:1400px) { main { padding-left:20px; padding-right:20px; } .line { font-size:44px; } .board { gap:10px; } .card { padding:10px; } .strips { gap:14px 12px; } }
</style>
</head>
<body data-page="dashboard">
<aside><div class="side"><div class="brand" id="brand"></div><nav id="nav" aria-label="Sections"></nav></div></aside>

<main id="dashboard-page">
  <header><div><h1>Dashboard</h1><p class="line" id="line"></p></div><button class="main-button" id="add1"></button></header>
  <dl class="figures" id="figures"></dl>
  <div class="two">
    <section class="panel"><div class="head"><h2>Revenue won by month</h2><a href="#dashboard">Show table</a></div><div class="chart" id="line-chart" data-label="Line chart of revenue won in each of the last 12 months"></div></section>
    <section class="panel"><div class="head"><h2>Deals won by month</h2><a href="#dashboard">Show table</a></div><div class="chart" id="bar-chart" data-label="Bar chart of deals won in each of the last 12 months"></div></section>
  </div>
  <div class="two wide">
    <section class="panel"><div class="head"><h2>Open deals by stage</h2><a href="#dashboard">Show table</a></div><div class="strips" id="strips"></div><p class="keys" id="keys"></p></section>
    <section class="panel"><div class="head"><h2>How far deals get</h2><a href="#dashboard">Show table</a></div><div class="steps" id="steps" data-label="Funnel of the value that reached each stage"></div></section>
  </div>
  <section class="panel" style="margin-bottom:14px"><h2>Follow-ups</h2><div class="columns" id="tasks"></div></section>
  <section class="panel"><h2>Recent activity</h2><ul class="columns" id="events"></ul></section>
</main>

<main id="pipeline-page">
  <header><div><h1>Pipeline</h1><p class="summary" id="summary"></p></div><button class="main-button" id="add2"></button></header>
  <div class="board" id="board"></div>
</main>

<script src="data.js"></script>
<script>
const M = t => `<span class="mono">${t}</span>`;
fill('#brand', MARK + 'Accountable'); fill('#nav', navHTML()); fill('#line', LINE);
fill('#add1', icon('plus', 17) + 'Add deal'); fill('#add2', icon('plus', 17) + 'Add deal');
fill('#figures', [
  ['Revenue won this month', usd(FIGURES.wonMonth), `${M(FIGURES.wonMonthDeals)} deals`],
  ['Revenue won in 12 months', usd(FIGURES.won12), `${M(FIGURES.won12Deals)} deals`],
  ['Open value', usd(FIGURES.open), `${M(FIGURES.openDeals)} deals`],
  ['Expected revenue', usd(FIGURES.expected), `${M(Math.round(FIGURES.expected / FIGURES.open * 100) + '%')} of open value`],
].map(([a, b, c]) => `<div><dt>${a}</dt><dd class="mono">${b}</dd><p>${c}</p></div>`).join(''));

draw('#line-chart', (w, h) => {
  const l = 50, r = w - 4, t = 26, b = h - 24, max = 210000, x = i => l + 14 + i * (r - l - 100) / 11, y = v => b - v / max * (b - t);
  const pts = MONTHS.map((m, i) => [x(i), y(m[1])]);
  return [0, 100000, 200000].map(v => `<line x1="${l}" x2="${r}" y1="${y(v)}" y2="${y(v)}" stroke="#E1E9EB"/><text x="${l - 10}" y="${y(v) + 4}" text-anchor="end">${usdK(v)}</text>`).join('')
    + `<path d="M${pts.map(p => p.join(',')).join('L')}" fill="none" stroke="#073B4C" stroke-width="2"/>`
    + pts.map(([px, py]) => `<circle cx="${px}" cy="${py}" r="6.5" fill="#06D6A0" stroke="#fff" stroke-width="2.5"/>`).join('')
    + `<text x="${x(10)}" y="${y(MONTHS[10][1]) - 12}" text-anchor="middle" font-weight="600">${usd(MONTHS[10][1])}</text><text x="${x(11) + 13}" y="${y(MONTHS[11][1]) + 4}" font-weight="600">${usd(MONTHS[11][1])}</text>`
    + MONTHS.map((m, i) => `<text x="${x(i)}" y="${h - 4}" text-anchor="middle">${m[0]}</text>`).join('');
});
draw('#bar-chart', (w, h) => {
  const b = h - 24, step = w / 12, bw = Math.min(34, step - 8), uh = 31;
  return MONTHS.map((m, i) => {
    const cx = step * (i + .5);
    return Array.from({ length: m[2] }, (_, k) => `<rect x="${cx - bw / 2}" y="${b - (k + 1) * (uh + 3)}" width="${bw}" height="${uh}" rx="6" fill="#06D6A0"/>`).join('') + `<text x="${cx}" y="${b - m[2] * (uh + 3) - 7}" text-anchor="middle" font-weight="600">${m[2]}</text><text x="${cx}" y="${h - 4}" text-anchor="middle">${m[0]}</text>`;
  }).join('');
});
const widest = Math.max(...OPEN.map(c => c.value)), bySize = list => [...list].sort((a, b) => b.value - a.value);
const strip = (c, label, scale = 1) => `<div class="strip" style="width:${scale * 100}%">${bySize(c.cards).map(d => `<span class="unit mono ${label && d.late ? 'late' : ''}" style="flex:${d.value} 1 0;background:${c.color};color:${c.on}" title="${d.name}, ${esc(d.org)}, ${usd(d.value)}">${label ? '$' + Math.round(d.value / 1000) + 'K' : ''}</span>`).join('')}</div>`;
fill('#strips', `<span></span><span></span><span class="col">Open value</span><span class="col">Expected</span>` + OPEN.map(c => `<div class="stage-name"><i class="dot" style="background:${c.color}"></i><span>${c.name}<small>${M(c.cards.length)} deals</small></span></div><div>${strip(c, true, c.value / widest)}<div class="expect" style="width:${c.expected / widest * 100}%"></div></div><span class="num mono">${usd(c.value)}</span><span class="num mono">${usd(c.expected)}</span>`).join(''));
fill('#keys', `<span><i style="width:22px;height:14px;border-radius:4px;background:#06D6A0"></i>One block is one deal</span><span><i style="width:22px;height:5px;border-radius:3px;background:#073B4C"></i>Expected revenue</span><span><i style="width:11px;height:11px;border-radius:50%;background:#EF476F"></i>Late</span>`);
// A block shows its value only where it fits
new ResizeObserver(() => document.querySelectorAll('#strips .unit').forEach(u => { u.dataset.v ??= u.textContent; u.textContent = u.dataset.v; const r = document.createRange(); r.selectNodeContents(u); if (r.getBoundingClientRect().width > u.clientWidth - 6) u.textContent = ''; })).observe(document.querySelector('#strips'));
draw('#steps', (w, h) => {
  const gap = 6, cw = (w + gap) / 5, b = h - 62, t = 44, max = FUNNEL[0].value;
  return FUNNEL.map((f, i) => {
    const x = i * cw, bw = cw - gap, bh = f.value / max * (b - t), mid = x + bw / 2;
    return `<rect x="${x}" y="${b - bh}" width="${bw}" height="${bh}" rx="8" fill="${f.color}"/><text x="${mid}" y="${b - bh - 24}" text-anchor="middle" style="font-size:12.5px;font-weight:600;letter-spacing:-.05em">${bw < 74 ? '$' + (f.value / 1e6).toFixed(2) + 'M' : usd(f.value)}</text><text x="${mid}" y="${b - bh - 8}" text-anchor="middle">${f.deals} deals</text><text x="${mid}" y="${b + 20}" text-anchor="middle" style="font-family:'Instrument Sans';font-size:14px;font-weight:600">${f.name}</text><text x="${mid}" y="${b + 40}" text-anchor="middle">${f.share ? f.share + '%' : ''}</text>`;
  }).join('') + `<text x="0" y="${h - 4}" style="font-family:'Instrument Sans';font-size:14px;fill:#4F6C78">The share is of the stage before.</text>`;
});
const who = (rec, org) => `<a href="#dashboard">${esc(rec)}</a>, ${esc(org)}`;
fill('#tasks', [...new Set(FOLLOW_UPS.map(f => f[0]))].map(d => { const n = daysFromToday(d);
  return `<div class="day">${n < 0 ? `<span class="tag">Overdue ${M(-n)} ${n === -1 ? 'day' : 'days'}</span>` : `<time class="mono">${dueLabel(d)}</time>`}<ul>${FOLLOW_UPS.filter(f => f[0] === d).map(([, t, text, rec, org]) => `<li class="task"><input type="checkbox" aria-label="Mark done: ${text}"><div>${text}<small>${who(rec, org)}</small></div></li>`).join('')}</ul></div>`; }).join(''));
fill('#events', RECENT.map(([d, t, text, rec, org]) => `<li class="event">${icon(t)}<div>${text}<small>${who(rec, org)}</small></div><time class="mono">${d === TODAY ? 'Today' : date(d)}</time></li>`).join(''));

fill('#summary', `${M(FIGURES.openDeals)} open deals worth ${M(usd(FIGURES.open))}, with ${M(usd(FIGURES.expected))} expected.`);
fill('#board', COLUMNS.map(c => `<section class="column"><div class="column-head"><div class="column-title"><i class="dot" style="background:${c.color}"></i>${c.name}<button aria-label="Add deal in ${c.name}">${icon('plus', 17)}</button></div>${strip(c)}<div class="facts"><span>Deals</span>${M(c.cards.length)}<span>Value</span>${M(usd(c.value))}<span>Expected</span>${M(usd(c.expected))}${c.key === 'won' || c.key === 'lost' ? `<span class="last">Last <span class="mono">90</span> days</span>` : ''}</div></div><div class="cards">${c.cards.map(d => `<article class="card">${d.late ? `<span class="tag">Late ${M(d.late)} ${d.late === 1 ? 'day' : 'days'}</span><br>` : ''}<a href="#pipeline">${d.name}</a><div class="org">${esc(d.org)}</div><div class="row mono"><span>${usd(d.value)}</span><span>${d.p}%</span></div><div class="meter"><i style="width:${d.p}%;background:${c.color}"></i></div><div class="close mono">${date(d.close)}</div></article>`).join('')}</div></section>`).join(''));
route();
</script>
</body>
</html>
